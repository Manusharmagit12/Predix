<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 40px; display: flex; gap: 40px; flex-wrap: wrap; }
.logo-box { background: #131b2e; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; width: 200px; text-align: center; }
.logo-preview { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
</style>
</head>
<body>

<!-- Option 1: Dimensional Predictive P (Intersecting Gradient Ribbons + Arrow) -->
<div class="logo-box">
  <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="p1_stem" x1="6" y1="4" x2="16" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0066FF"/>
        <stop offset="100%" stop-color="#0038B8"/>
      </linearGradient>
      <linearGradient id="p1_loop" x1="10" y1="4" x2="32" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00E5FF"/>
        <stop offset="50%" stop-color="#0066FF"/>
        <stop offset="100%" stop-color="#00D09C"/>
      </linearGradient>
      <filter id="p1_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.4"/>
      </filter>
    </defs>
    <!-- Left vertical anchor -->
    <rect x="5" y="4" width="7" height="28" rx="3.5" fill="url(#p1_stem)"/>
    <!-- Dynamic forward predictive loop forming P -->
    <path d="M10 4.5 C10 4.5 19 4 24 8 C28.5 11.5 28.5 18.5 24 22 C19 26 10 25.5 10 25.5 L14 19 C14 19 18 19.5 20.5 17.5 C22.5 16 22.5 14 20.5 12.5 C18 10.5 14 11 14 11 Z" fill="url(#p1_loop)" filter="url(#p1_glow)"/>
    <!-- Glowing core sparkle -->
    <circle cx="15" cy="15" r="2" fill="#FFFFFF"/>
  </svg>
  <div class="logo-preview">Option 1: Ribbon P</div>
</div>

<!-- Option 2: Futuristic Hex-Prism / Quantum Delta P (Polymarket + Kalshi Precision) -->
<div class="logo-box">
  <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="p2_g1" x1="4" y1="4" x2="18" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0066FF"/>
        <stop offset="100%" stop-color="#4F46E5"/>
      </linearGradient>
      <linearGradient id="p2_g2" x1="12" y1="4" x2="32" y2="18" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="100%" stop-color="#00D09C"/>
      </linearGradient>
      <linearGradient id="p2_g3" x1="10" y1="12" x2="22" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
    <!-- Geometric P-facet Left -->
    <path d="M6 5 C6 3.89 6.89 3 8 3 L14 3 C15.1 3 16 3.89 16 5 L16 31 C16 32.1 15.1 33 14 33 L8 33 C6.89 33 6 32.1 6 31 Z" fill="url(#p2_g1)"/>
    <!-- Geometric P-loop Right Arrow -->
    <path d="M14 3 L23 3 C27.97 3 32 7.03 32 12 C32 16.97 27.97 21 23 21 L14 21 Z M14 9 L22 9 C23.66 9 25 10.34 25 12 C25 13.66 23.66 15 22 15 L14 15 Z" fill="url(#p2_g2)"/>
    <!-- Probability delta facet -->
    <path d="M14 3 L24 12 L14 21 Z" fill="url(#p2_g3)" opacity="0.3"/>
  </svg>
  <div class="logo-preview">Option 2: Hex P-Delta</div>
</div>

<!-- Option 3: The "Future Horizon" P (Sleek, iconic, supreme fintech mark) -->
<div class="logo-box">
  <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="p3_grad1" x1="4" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0066FF"/>
        <stop offset="60%" stop-color="#00C4FF"/>
        <stop offset="100%" stop-color="#00E5A3"/>
      </linearGradient>
      <linearGradient id="p3_cut" x1="12" y1="8" x2="24" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0b0e14" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#0b0e14" stop-opacity="0.7"/>
      </linearGradient>
    </defs>
    <!-- Outer bold silhouette -->
    <path d="M6 6 C6 3.79 7.79 2 10 2 L22 2 C27.52 2 32 6.48 32 12 C32 17.52 27.52 22 22 22 L14 22 L14 32 C14 33.1 13.1 34 12 34 L8 34 C6.89 34 6 33.1 6 32 Z" fill="url(#p3_grad1)"/>
    <!-- Negative space forward chevron/diamond creating the P counter -->
    <path d="M14 8 L21 8 C23.21 8 25 9.79 25 12 C25 14.21 23.21 16 21 16 L14 16 Z" fill="#0b0e14"/>
    <!-- Dynamic upward trend slash across the P -->
    <path d="M22 2 L30 10 L26 14 L18 6 Z" fill="#FFFFFF" opacity="0.25"/>
  </svg>
  <div class="logo-preview">Option 3: Horizon P</div>
</div>

<!-- Option 4: "Predix Probability Node" — Two interlocking hyper-fluid ribbons -->
<div class="logo-box">
  <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
    <defs>
      <linearGradient id="p4_cyan" x1="2" y1="2" x2="28" y2="28" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#00E5FF"/>
        <stop offset="100%" stop-color="#0066FF"/>
      </linearGradient>
      <linearGradient id="p4_green" x1="10" y1="8" x2="34" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0066FF"/>
        <stop offset="100%" stop-color="#00D09C"/>
      </linearGradient>
      <filter id="p4_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0066FF" flood-opacity="0.45"/>
      </filter>
    </defs>
    <!-- Back wing: upward predictive curve -->
    <path d="M12 33 C8 33 6 30 6 26 L6 7 C6 4 8 2 11 2 L22 2 C28.08 2 33 6.92 33 13 C33 19.08 28.08 24 22 24 L14 24 L14 31 C14 32.1 13.1 33 12 33 Z" fill="url(#p4_cyan)"/>
    <!-- Front facet / counter with transparent inner cut -->
    <path d="M14 8 L21.5 8 C24.26 8 26.5 10.24 26.5 13 C26.5 15.76 24.26 18 21.5 18 L14 18 Z" fill="#090d16"/>
    <!-- Vibrant YES green momentum accent (the tip of prediction) -->
    <path d="M22 2 C28.08 2 33 6.92 33 13 C33 15.5 32.15 17.8 30.7 19.6 L25 13.5 L30 8 C28 5 25 3 22 2 Z" fill="url(#p4_green)" filter="url(#p4_glow)"/>
  </svg>
  <div class="logo-preview">Option 4: Momentum P</div>
</div>

</body>
</html>
